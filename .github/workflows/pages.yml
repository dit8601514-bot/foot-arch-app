name: 테스트 후 GitHub Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 단위 테스트(분류 경계값·검출·환산·보정·트래킹)
        run: node test/unit.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 가혹 조건 합성 벤치마크(품질 게이트)
        run: |
          pip install --quiet numpy pillow
          BENCH_OUT=ci python3 bench/gen.py 3 500
          BENCH_DIR=ci BENCH_MIN_SUCCESS=0.97 BENCH_MAX_WRONG=0 BENCH_MAX_P95=1.0 BENCH_MAX_FLOOR_P95=0.8 BENCH_MIN_STD_SOLE=0.6 node bench/run.js src/core.js ALG-CI
      - name: 단일 HTML 빌드
        run: node build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
