<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c6e">
<title>발 아치 기능 평가</title>
<meta name="build" content="__BUILD__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="발 아치">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f6f7;--surface:#ffffff;--surface-2:#eef2f3;--line:#d9e0e2;
  --ink:#10201f;--ink-2:#4a5a5c;--ink-3:#738385;
  --brand:#0f5c6e;--brand-2:#e3f0f2;--accent:#2a78d6;
  --series-1:#2a78d6;--series-2:#eb6834;
  --good:#0f7a3d;--good-bg:#e4f4ea;--warn:#8a5a00;--warn-bg:#fdf1d8;--bad:#b42318;--bad-bg:#fdeceb;--info-bg:#e8f0fb;
  --radius:14px;--shadow:0 1px 2px rgba(16,32,31,.06),0 2px 8px rgba(16,32,31,.05);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:650;letter-spacing:-.2px}
header.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-width:40px;height:40px;font-size:15px;padding:0 10px}
main{flex:1;padding:14px 14px 96px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs a{flex:1;text-align:center;padding:9px 2px 8px;font-size:12.5px;color:var(--ink-2);text-decoration:none;font-weight:550}
nav.tabs a .ic{display:block;font-size:19px;line-height:1.2}
nav.tabs a.on{color:var(--brand)}
h2{font-size:21px;margin:4px 0 10px;letter-spacing:-.3px}
h3{font-size:16.5px;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--ink-2)}.small{font-size:13.5px}.tiny{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:10px 0;border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:46px;padding:0 16px;font-size:15.5px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%;margin:6px 0}.btn.big{min-height:58px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 10px;font-size:13.5px;border-radius:10px}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px}
input[type=checkbox],input[type=radio]{width:auto;transform:scale(1.25);margin-right:8px}
.chk{display:flex;align-items:flex-start;gap:4px;margin:8px 0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:42px;font:inherit;font-weight:600;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
.badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.b-good{background:var(--good-bg);color:var(--good)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:#1d4f91}
.note{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.note.warn{background:var(--warn-bg);color:#5c3d00}.note.bad{background:var(--bad-bg);color:#7a1a12}.note.info{background:var(--info-bg);color:#183c6b}.note.good{background:var(--good-bg);color:#0b4f28}
ol.steps,ul.list{padding-left:20px;margin:6px 0}ol.steps li,ul.list li{margin:5px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:4px;margin:4px 0 12px}.stepper span{flex:1;height:6px;border-radius:3px;background:var(--line)}.stepper span.on{background:var(--brand)}
.camwrap{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;width:100%}
.camwrap video,.camwrap canvas,.camwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:800;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.6);pointer-events:none}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.checks div{font-size:13.5px;padding:7px 9px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.checks div.ok{background:var(--good-bg);border-color:#b9e2c8;color:var(--good)}.checks div.no{background:var(--warn-bg);border-color:#f0d9a6;color:var(--warn)}
.statusline{font-weight:700;text-align:center;margin:8px 0;font-size:16px}
.result-big{font-size:40px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.t th{color:var(--ink-2);font-weight:600}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#10201f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:99;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast.err{background:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.list-item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.list-item:last-child{border-bottom:0}
.chart{width:100%;height:220px;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin:4px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#10201f;color:#fff;font-size:12.5px;padding:6px 8px;border-radius:8px;z-index:95;white-space:nowrap}
.foot-svg{width:100%;height:auto;background:var(--surface-2);border-radius:12px}
video.ex{width:100%;border-radius:12px;background:#000}
.placeholder{border:2px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;color:var(--ink-2)}
.recbadge{font-size:18px;font-weight:700;background:#e53935;color:#fff;padding:6px 12px;border-radius:10px;position:absolute;top:10px;right:10px;text-shadow:none}
.voicecap{position:absolute;left:8px;right:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-size:17px;font-weight:700;padding:8px 12px;border-radius:10px;text-align:center;z-index:3;pointer-events:none}
.hide{display:none!important}
:focus-visible{outline:3px solid #7cb7ff;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header class="top"><button id="backBtn" aria-label="뒤로">←</button><h1 id="title">발 아치 기능 평가</h1><button id="homeBtn" aria-label="홈">홈</button></header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs">
    <a href="#/home" data-tab="home"><span class="ic">⌂</span>홈</a>
    <a href="#/self" data-tab="self"><span class="ic">◎</span>검사</a>
    <a href="#/exercises" data-tab="exercises"><span class="ic">▶</span>운동</a>
    <a href="#/manage" data-tab="manage"><span class="ic">▤</span>관리</a>
    <a href="#/settings" data-tab="settings"><span class="ic">⚙</span>설정</a>
  </nav>
</div>
<!--CORE-->
<!--APP-->
</body>
</html>
